<style>

</style></head><body>
<header style="display:flex;justify-content:space-between;align-items:center;">
  <h1>Dart-Abend</h1>
  <span id="room-badge" class="badge">Raum: lädt...</span>
</header>
<nav id="nav"></nav><main id="v"></main>
<script>
const $=s=>document.querySelector(s),esc=s=>s.replace(/[&<>"]/g,c=>'&#'+c.charCodeAt(0)+';');
let S={boards:8,mode:501,legs:2,dout:true,groups:0,players:[]},M=null,TN=null,LV={},PL={},SV='all',BASE={},RS=false,GU=[],gm='',R=['Anna','Ben','Chris','Dana'].map(n=>({n,on:true})),ST={},hist=[],tab='setup',pick=[0,1],msg='';
const T={pl:'Spieler',setup:'Turnier',plan:'Aktuelles Turnier',live:'Livesicht',ts:'Tabelle',match:'Match',stats:'Statistik'};
const mk=()=>({darts:0,points:0,c180:0,hiF:0,hT:0,att:0,hit:0,won:0,wd:0,mp:0,mw:0,lp:0});
const avg=n=>{const s=ST[n];return s&&s.darts?(s.points/s.darts*3).toFixed(1):'–'};
const gcount=n=>S.groups?Math.min(S.groups,Math.max(1,Math.floor(n/2))):(n<=8?1:Math.ceil(n/4));
function plan(n,b){
 if(n<2)return'Mindestens 2 Spieler nötig.';
 const g=gcount(n),base=Math.floor(n/g),ex=n%g;let gm=0;
 for(let i=0;i<g;i++){const k=base+(i<ex?1:0);gm+=k*(k-1)/2}
 let sz=1;while(sz<n)sz*=2;
 const gw=Math.ceil(gm/b);let kw=Math.ceil((n-sz/2)/b);
 for(let m=sz/4;m>=1;m/=2)kw+=Math.ceil(m/b);
 return `Gruppenphase: ${g} Gruppe${g>1?'n':''} (je ${Math.floor(n/g)}${n%g?' bis '+Math.ceil(n/g):''} Spieler), ${gm} Matches, ${gw} Durchgänge.<br>KO-Phase: alle ${n} Spieler, ${sz-n} Freilose, ${n-1+(n>=4?1:0)} Matches${n>=4?' (mit Spiel um Platz 3)':''}, ${kw} Durchgänge.<br>Dauer bei 15 Min. pro Match: ca. ${((gw+kw)*.25).toFixed(1)} Std.`}
const snap=()=>hist.push(JSON.stringify({M,ST,TN,PL}));
const save=()=>{try{localStorage.setItem('dart-r',JSON.stringify(R));localStorage.setItem('dart-code',turnierCode)}catch(e){}};
try{const x=JSON.parse(localStorage.getItem('dart-r'));if(Array.isArray(x))R=x}catch(e){}
function addName(n,g){n=n.trim().slice(0,24);
 if(!n){gm='Bitte einen Namen eingeben.';return}
 if([...R.map(p=>p.n),...GU].some(x=>x.toLowerCase()==n.toLowerCase())){gm='Diesen Namen gibt es schon.';return}
 gm='';g?GU.push(n):R.push({n,on:true});save()}
const savePL=()=>{try{localStorage.setItem('dart-pl',JSON.stringify(PL))}catch(e){}};
try{const x=JSON.parse(localStorage.getItem('dart-pl'));if(x&&typeof x=='object')PL=x}catch(e){}
try{const x=JSON.parse(localStorage.getItem('dart-st'));if(x&&typeof x=='object')ST=x}catch(e){}
function places(){
 if(!TN||!TN.ko)return null;const f=TN.ko[TN.ko.length-1][0];
 if(!f.done||(TN.p3&&!TN.p3.done))return null;
 const a=f.w,b=f.w==f.a?f.b:f.a;let c=null;
 if(TN.p3)c=TN.p3.w;else{const all=[...new Set(TN.gm.flatMap(m=>[m.a,m.b]))];if(all.length==3)c=all.find(x=>x!=a&&x!=b)}
 return [a,b,c]}
function recPl(){const p=places();if(!p||TN.rec)return;TN.rec=1;p.forEach((n,i)=>{if(n){PL[n]=PL[n]||[0,0,0];PL[n][i]++}});savePL()}
function schema(n){
 if(n<2)return '<p class="mut">Wähle mindestens 2 Spieler.</p>';
 const g=gcount(n),b=Math.floor(n/g),x=n%g;let sz=1;while(sz<n)sz*=2;
 const box=(t,sub)=>`<div class="sb"><b>${t}</b>${sub?`<small>${sub}</small>`:''}</div>`;
 const cols=[`<div class="sc2"><div class="cl">Gruppen</div>${Array.from({length:Math.min(g,8)},(_,i)=>box('Gr. '+(i+1),(b+(i<x?1:0))+' Spieler')).join('')}${g>8?`<small>+ ${g-8} weitere</small>`:''}</div>`];
 for(let m=sz/2,k=0;m>=1;m/=2,k++){const nme=m==1?'Finale':m==2?'Halbfinale':m==4?'Viertelfinale':'Runde '+(k+1);
  cols.push(`<div class="sc2"><div class="cl">${nme}</div>${Array.from({length:Math.min(m,8)},()=>box('Match')).join('')}${m>8?`<small>${m} Matches</small>`:''}${k==0&&sz>n?`<small>${sz-n} Freilose</small>`:''}${m==1&&n>=4?'<div class="cl" style="margin-top:10px">Platz 3</div>'+box('Spiel um Platz 3'):''}</div>`)}
 return `<div class="tree">${cols.join('<div class="ar">›</div>')}</div><p class="mut">Alle ${n} Spieler kommen in die KO-Runde, gesetzt wird Erster gegen Letzten.</p>`}
function vPlace(){const e=Object.entries(PL).sort((a,b)=>b[1][0]-a[1][0]||b[1][1]-a[1][1]||b[1][2]-a[1][2]);
 if(!e.length)return '';
 return `<div class="card sc"><h2>Platzierungen</h2><table><tr><th>Spieler</th><th>1.</th><th>2.</th><th>3.</th></tr>${e.map(([n,v])=>`<tr><td>${esc(n)}</td><td>${v[0]}</td><td>${v[1]}</td><td>${v[2]}</td></tr>`).join('')}</table></div>`}
const tavg=n=>{const s=ST[n];if(!s)return 0;const b=BASE[n]||mk(),d=s.darts-b.darts;return d?(s.points-b.points)/d*3:0};
const bd=id=>{const k=pend().slice(0,S.boards).findIndex(t=>t.id==id);return k<0?'?':k+1};
const DN=n=>n==25?'Bull':n,allM=()=>TN?[...TN.gm,...(TN.ko||[]).flat(),...(TN.p3?[TN.p3]:[])]:[],pend=()=>allM().filter(m=>!m.done&&m.a&&m.b);
function start(p,tm){
 p.forEach(n=>ST[n]=ST[n]||mk());hist=[];
 M={p,tm:tm==null?null:tm,rem:[S.mode,S.mode],vs:S.mode,legs:[0,0],turn:0,starter:0,last:['–','–'],ld:[0,0],dr:[0,0],pt:[0,0],vd:[],vp:0,mod:'S',over:false}}
function nextVisit(){M.vd=[];M.vp=0;M.mod='S';M.turn=1-M.turn;M.vs=M.rem[M.turn]}
function dart(n,m){
 M.p.forEach(x=>{ST[x]=ST[x]||mk()});
 const i=M.turn,s=ST[M.p[i]],r=M.rem[i],dbl=m=='D',pts=m=='M'?0:n*(m=='D'?2:m=='T'?3:1);
 snap();
 if(S.dout&&((r<=40&&r%2==0)||r==50)&&(dbl||m=='M'))s.att++;
 s.darts++;M.ld[i]++;M.dr[i]++;M.vp+=pts;M.vd.push(m=='M'?'Miss':(m=='S'?'':m)+DN(n));
 const nr=r-pts;
 if(nr<0||(S.dout&&nr==1)||(S.dout&&nr==0&&!dbl)){
  const x=3-M.vd.length;s.darts+=x;M.ld[i]+=x;M.dr[i]+=x;M.rem[i]=M.vs;M.last[i]='Bust';nextVisit();return}
 M.rem[i]=nr;
 if(nr==0){
  s.points+=M.vp;M.pt[i]+=M.vp;if(S.dout)s.hit++;s.hiF=Math.max(s.hiF,M.vs);s.hT=Math.max(s.hT||0,M.vs);s.won++;s.wd+=M.ld[i];M.legs[i]++;M.last[i]=M.vs;
  M.p.forEach(n=>{ST[n].lp=(ST[n].lp||0)+1});
  if(M.legs[i]>=S.legs){M.over=true;M.p.forEach((n,k)=>{ST[n].mp=(ST[n].mp||0)+1;if(k==i)ST[n].mw=(ST[n].mw||0)+1});if(M.tm!=null)result()}
  else{M.rem=[S.mode,S.mode];M.ld=[0,0];M.starter=1-M.starter;M.turn=1-M.starter;M.last=['–','–'];nextVisit()}
  return}
 if(M.vd.length==3){s.points+=M.vp;M.pt[i]+=M.vp;if(M.vp==180)s.c180++;M.last[i]=M.vp;nextVisit()}}
function result(){
 const t=allM().find(x=>x.id==M.tm);if(!t)return;
 t.la=M.legs[0];t.lb=M.legs[1];t.done=true;
 if(t.ko||t.third){t.w=t.la>t.lb?t.a:t.b;if(t.ko)advance(t)}
 phase();recPl()}
function advance(t){
 const [r,k]=t.id.slice(1).split('_').map(Number),nx=TN.ko[r+1];
 if(TN.p3&&TN.ko[r].length==2&&t.a&&t.b)TN.p3[k%2?'b':'a']=t.w==t.a?t.b:t.a;
 if(!nx)return;
 nx[k>>1][k%2?'b':'a']=t.w}
function rr(p){const a=[...p];if(a.length%2)a.push(null);const n=a.length,R=[];
 for(let r=0;r<n-1;r++){const m=[];for(let i=0;i<n/2;i++){const x=a[i],y=a[n-1-i];if(x&&y)m.push([x,y])}R.push(m);a.splice(1,0,a.pop())}return R}
function startTN(){
 const P=S.players;if(P.length<2){msg='Mindestens 2 Spieler nötig.';return}
 const n=P.length,g=gcount(n),G=Array.from({length:g},()=>[]);
 P.forEach((p,k)=>G[k%g].push(p));
 const R=G.map(rr),gm=[];let c=0;
 for(let r=0;r<Math.max(...R.map(x=>x.length));r++)R.forEach((x,gi)=>(x[r]||[]).forEach(([a,b])=>gm.push({id:'g'+c++,g:gi,a,b,la:0,lb:0,done:false})));
 Object.values(ST).forEach(s=>s.hT=0);BASE=JSON.parse(JSON.stringify(ST));TN={G,gm,ko:null};LV={};M=null;hist=[];msg='';tab='plan'}
function stand(g){
 const r=g.map(n=>({n,p:0,w:0,l:0,d:0}));
 TN.gm.forEach(m=>{if(!m.done||!g.includes(m.a))return;const A=r.find(x=>x.n==m.a),B=r.find(x=>x.n==m.b);A.d+=m.la-m.lb;B.d+=m.lb-m.la;if(m.la>m.lb){A.p+=2;A.w++;B.l++}else{B.p+=2;B.w++;A.l++}});
 return r.sort((x,y)=>y.p-x.p||y.d-x.d||(tavg(y.n)-tavg(x.n))||0)}
function phase(){
 if(TN.ko||TN.gm.some(m=>!m.done))return;
 const rows=[];TN.G.forEach(g=>stand(g).forEach((r,pos)=>rows.push({n:r.n,pos,p:r.p,d:r.d,a:tavg(r.n)})));
 rows.sort((x,y)=>x.pos-y.pos||y.p-x.p||y.d-x.d||y.a-x.a);
 const n=rows.length;let sz=1;while(sz<n)sz*=2;
 let o=[1];while(o.length<sz){const l=o.length*2+1;o=o.flatMap(x=>[x,l-x])}
 const seed=k=>k<=n?rows[k-1].n:null,K=[[]];
 for(let k=0;k<sz;k+=2)K[0].push({id:'k0_'+k/2,ko:1,a:seed(o[k]),b:seed(o[k+1]),la:0,lb:0,done:false});
 for(let r=1,m=sz/4;m>=1;m/=2,r++)K.push(Array.from({length:m},(_,k)=>({id:'k'+r+'_'+k,ko:1,a:null,b:null,la:0,lb:0,done:false})));
 TN.ko=K;TN.p3=n>=4?{id:'p3',third:1,a:null,b:null,la:0,lb:0,done:false}:null;K[0].forEach(t=>{if(!t.a||!t.b){t.done=true;t.w=t.a||t.b;advance(t)}})}
const stp=(a,v)=>`<span class="st"><button data-a="${a}" data-v="-1" aria-label="weniger">−</button><b>${v}</b><button data-a="${a}" data-v="1" aria-label="mehr">+</button></span>`;
function vSetup(){return `<div class="card" style="border-color:var(--grn)"><h2>🛜 Raum / Turnier-Code</h2><p class="mut">Geräte mit demselben Code sind live synchronisiert.</p>
<div style="display:flex;gap:8px"><input id="tcode" maxlength="20" value="${esc(turnierCode)}" aria-label="Raum-Code" style="margin-bottom:0"><button data-a="changecode" style="width:130px;margin-bottom:0">Verbinden</button></div>
<p class="mut" id="rstat">${ERR||(online?'Verbunden mit '+esc(turnierCode):'Nicht verbunden')}</p></div>
<div class="card"><h2>Turnier einrichten</h2>
<div class="row"><span>Scheiben (max. 8)</span>${stp('b',S.boards)}</div>
<div class="row"><span>Spiel</span><span>${[301,501].map(m=>`<button class="chip ${S.mode==m?'on':''}" data-a="mode" data-v="${m}">${m}</button>`).join(' ')}</span></div>
<div class="row"><span>Legs zum Matchsieg</span>${stp('lg',S.legs)}</div>
<div class="row"><span>Gruppen</span>${stp('gr',S.groups||'Auto')}</div>
<div class="row"><span>Double-Out</span><span>${[[true,'An'],[false,'Aus']].map(([f,t])=>`<button class="chip ${S.dout===f?'on':''}" data-a="dout" data-v="${f}">${t}</button>`).join(' ')}</span></div></div>
<div class="card"><h2>Mitspieler (${S.players.length})</h2>
${R.map((p,i)=>`<label class="m"><span>${esc(p.n)}</span><input type="checkbox" data-c="${i}" ${p.on?'checked':''} aria-label="${esc(p.n)} spielt mit"></label>`).join('')||'<p class="mut">Lege im Tab Spieler zuerst Spieler an.</p>'}
<button data-a="all" style="margin-top:8px">Alle an oder aus</button></div>
<div class="card"><h2>Gäste</h2>${GU.map((g,i)=>`<div class="m"><span>${esc(g)} <span class="bd">Gast</span></span><button data-a="gdel" data-v="${i}">Entfernen</button></div>`).join('')}
<input id="gn" placeholder="Name des Gasts" maxlength="24" aria-label="Name des Gasts"><button data-a="gadd">Gast hinzufügen</button><p class="err">${gm}</p><p class="mut">Höchstens 64 Spieler.</p></div>
<div class="card"><h2>Turnierplan</h2><p id="plan">${plan(S.players.length,S.boards)}</p></div>
<div class="card"><h2>Turnierbaum</h2>${schema(S.players.length)}</div>
<p class="err">${msg}</p><button class="big" data-a="tstart">Turnier starten</button>`}
function vMatch(){
 if(!M){const o=i=>`<select data-i="${i}" aria-label="Spieler ${i+1}">${S.players.map((p,k)=>`<option value="${k}" ${pick[i]==k?'selected':''}>${esc(p)}</option>`).join('')}</select>`;
  return `<div class="card"><h2>Freies Match</h2><p class="mut">Turnierspiele startest du im Tab Aktuelles Turnier mit „Spielen“.</p>${o(0)}${o(1)}<p class="err">${msg}</p><button class="big" data-a="go">Match starten</button></div>`}
 const pn=M.p.map((n,i)=>`<div class="pl ${M.turn==i&&!M.over?'act':''}"><div class="nm">${esc(n)}</div><div class="n rem">${M.rem[i]}</div><div class="mut">Legs ${M.legs[i]} · Match-Ø ${M.dr[i]?(M.pt[i]/M.dr[i]*3).toFixed(1):'–'}<br>zuletzt ${M.last[i]}</div></div>`).join('');
 let inp;
 if(M.over){const w=M.legs[0]>M.legs[1]?0:1,t=M.tm!=null;inp=`<div class="win">${esc(M.p[w])} gewinnt ${M.legs[0]}:${M.legs[1]}</div><button class="big" data-a="${t?'back':'new'}">${t?'Zurück zum aktuellen Turnier':'Neues Match'}</button>`}
 else inp=`<div class="card"><div class="mut">${esc(M.p[M.turn])} wirft Pfeil ${M.vd.length+1} von 3</div><div class="n vis">${M.vd.join('   ')||'–'}</div>
<div class="mods">${[['S','Single'],['D','Doppel'],['T','Triple']].map(([k,t])=>`<button class="chip ${M.mod==k?'on':''}" data-a="mod" data-v="${k}">${t}</button>`).join('')}<button data-a="miss">Miss</button></div>
<div class="pad5">${Array.from({length:20},(_,k)=>k+1).concat(25).map(n=>`<button data-a="d" data-v="${n}" ${n==25&&M.mod=='T'?'disabled':''}>${M.mod=='S'?'':M.mod}${DN(n)}</button>`).join('')}</div></div>`;
 return `<div class="pls">${pn}</div>${inp}${M.over?'':'<button data-a="undo">Letzten Pfeil zurücknehmen</button>'}<p class="mut">Prototyp: Die Daten liegen nur auf diesem Gerät. Live-Sync auf mehreren Scheiben kommt mit der Datenbank.</p>`}
function vPlan(){
 if(!TN)return `<div class="card"><h2>Noch kein Turnier</h2><p>Lege im Tab Turnier die Spieler fest und starte das Turnier. Hier siehst du dann Scheiben, Spielplan, Tabellen und den KO-Baum.</p></div>`;

 const rn=k=>{if(k>=TN.ko.length)return 'Spiel um Platz 3';const c=TN.ko[k].length;return c==1?'Finale':c==2?'Halbfinale':c==4?'Viertelfinale':'Runde '+(k+1)};

${P.length>B?`<div class="card"><h2>Als Nächstes</h2>${P.slice(B,B+8).map(t=>`<div class="m"><span>${nm(t)}</span></div>`).join('')}</div>`:''}
${TN.ko?`<details class="card" open><summary>KO-Baum</summary>${[...TN.ko,...(TN.p3?[[TN.p3]]:[])].map((R,k)=>`<h2>${rn(k)}</h2>${R.map(t=>`<div class="m"><span>${nm(t)}</span><span class="bd">${res(t)}</span></div>`).join('')}`).join('')}</details>`:''}
<details class="card"><summary>Gruppen und Ergebnisse</summary>${TN.G.map((g,gi)=>`<h2>Gruppe ${gi+1}</h2><div class="sc"><table><tr><th>Spieler</th><th>Pkt</th><th>S</th><th>N</th><th>Legs</th></tr>${stand(g).map(r=>`<tr><td>${esc(r.n)}</td><td>${r.p}</td><td>${r.w}</td><td>${r.l}</td><td>${r.d>0?'+':''}${r.d}</td></tr>`).join('')}</table></div>${TN.gm.filter(t=>t.g==gi&&t.done).map(t=>`<div class="m"><span>${nm(t)}</span><span class="bd">${res(t)}</span></div>`).join('')}`).join('')}</details>`}
function vPlayers(){return `<div class="card"><h2>Spieler anlegen</h2><input id="nn" placeholder="Name" maxlength="24" aria-label="Name"><button class="big" data-a="padd">Spieler speichern</button><p class="err">${gm}</p></div>
<div class="card"><h2>Alle Spieler (${R.length})</h2>${R.map((p,i)=>`<div class="m"><span>${esc(p.n)}</span><button data-a="pdel" data-v="${i}">Entfernen</button></div>`).join('')||'<p class="mut">Noch keine Spieler.</p>'}<p class="mut">Wer beim Turnier mitspielt, wählst du im Tab Turnier.</p></div>`}
function vLive(){
 const L=Object.values(LV).filter(m=>!m.over);
 if(!L.length)return `<div class="card"><h2>Gerade läuft nichts</h2><p>Sobald ein Match gestartet ist, siehst du hier den Live-Stand aller Scheiben.</p></div>`;
 return L.map(m=>`<div class="card"><h2>${m.tm!=null?'Scheibe '+bd(m.tm):'Freies Match'}</h2><div class="pls">${m.p.map((n,i)=>`<div class="pl ${m.turn==i?'act':''}"><div class="nm">${esc(n)}</div><div class="n rem">${m.rem[i]}</div><div class="mut">Legs ${m.legs[i]} · Match-Ø ${m.dr[i]?(m.pt[i]/m.dr[i]*3).toFixed(1):'–'}</div></div>`).join('')}</div><p class="mut">${esc(String(m.p[m.turn]??''))} ist dran, Pfeil ${m.vd.length+1} von 3${m.vd.length?': '+m.vd.join(' '):''}</p></div>`).join('')+'<p class="mut">Mit der Datenbank siehst du alle Scheiben später live auf deinem Handy, auch wenn die Matches auf anderen Geräten laufen.</p>'}
function vTS(){
 if(!TN)return `<div class="card"><h2>Noch kein Turnier</h2><p>Starte im Tab Turnier ein Turnier, dann siehst du hier Tabellen und Statistiken.</p></div>`;
 const av=n=>tavg(n)?tavg(n).toFixed(1):'–';
 const th=g=>`<tr><th>#</th><th>Spieler</th>${g?'<th>Gr.</th>':''}<th>Sp</th><th>S</th><th>N</th><th>Legs</th><th>Pkt</th><th>Ø</th></tr>`;
 const row=(r,i,g)=>`<tr><td>${i+1}</td><td>${esc(r.n)}</td>${g?`<td>${g}</td>`:''}<td>${r.w+r.l}</td><td>${r.w}</td><td>${r.l}</td><td>${r.d>0?'+':''}${r.d}</td><td>${r.p}</td><td>${av(r.n)}</td></tr>`;
 const gr=TN.G.map(g=>stand(g));
 const all=gr.flatMap((s,gi)=>s.map((r,pos)=>({...r,gi,pos}))).sort((x,y)=>x.pos-y.pos||y.p-x.p||y.d-x.d||tavg(y.n)-tavg(x.n));
 const pl=places();
 return `${pl?`<div class="win">Sieger: ${esc(pl[0])}<br><small>2. ${esc(pl[1])}${pl[2]?', 3. '+esc(pl[2]):''}</small></div>`:''}
<h2 style="margin:4px 0 8px">Turnierstatistik</h2>
${gr.map((s,gi)=>`<div class="card sc"><h2>Gruppe ${gi+1}</h2><table>${th(false)}${s.map((r,i)=>row(r,i)).join('')}</table></div>`).join('')}
${gr.length>1?`<div class="card sc"><h2>Gesamtwertung</h2><table>${th(true)}${all.map((r,i)=>row(r,i,r.gi+1)).join('')}</table><p class="mut">Setzliste fürs KO-Feld: erst Gruppenplatz, dann Punkte, Leg-Differenz und Average.</p></div>`:''}
<p class="mut">Sp = Spiele, S = Siege, N = Niederlagen, Legs = Leg-Differenz, Pkt = Punkte (2 pro Sieg), Ø = Turnier-Average.</p>
${vStats0('tn')}`}
function vStats(){return vPlace()+vStats0()+`<button data-a="rst">${RS?'Wirklich alle Statistiken löschen?':'Statistiken zurücksetzen'}</button>`}
function vStats0(mode){
 const tn=(mode||SV)=='tn'&&TN,B=n=>tn&&BASE[n]?BASE[n]:mk();
 const get=n=>{const s=ST[n],b=B(n),d=k=>(s[k]||0)-(b[k]||0);return {darts:d('darts'),points:d('points'),c180:d('c180'),att:d('att'),hit:d('hit'),won:d('won'),wd:d('wd'),mp:d('mp'),mw:d('mw'),lp:d('lp'),hiF:tn?(s.hT||0):s.hiF}};
 const av=n=>{const g=get(n);return g.darts?g.points/g.darts:0};
 const names=Object.keys(ST).filter(n=>get(n).darts>0).sort((a,b)=>av(b)-av(a));
 const tabs=TN&&!mode?`<div class="row"><span class="mut">Zeitraum</span><span>${[['all','Alle Spiele'],['tn','Dieses Turnier']].map(([k,t])=>`<button class="chip ${SV==k?'on':''}" data-a="sv" data-v="${k}">${t}</button>`).join(' ')}</span></div>`:'';
 if(!names.length)return `${tabs}<div class="card"><h2>Noch keine Statistik</h2><p>Starte ein Match und wirf Pfeile, dann erscheinen hier Average, Doppelquote und mehr.</p></div>`;
 const row=n=>{const g=get(n);return `<tr><td>${esc(n)}</td><td>${(av(n)*3).toFixed(1)}</td><td>${g.darts}</td><td>${g.att?Math.round(g.hit/g.att*100)+' %':'–'}</td><td>${g.c180}</td><td>${g.hiF||'–'}</td><td>${g.won?(g.wd/g.won).toFixed(1):'–'}</td><td>${g.mw}/${g.mp}</td><td>${g.won}/${g.lp}</td></tr>`};
 return `${tabs}<div class="card sc"><h2>${tn?'Dieses Turnier':'Alle Spiele'}</h2><p class="mut">Gespielt: ${Math.round(names.reduce((a,n)=>a+get(n).mp,0)/2)} Matches, ${Math.round(names.reduce((a,n)=>a+get(n).lp,0)/2)} Legs</p><table><tr><th>Spieler</th><th>Ø</th><th>Pfeile</th><th>Doppel</th><th>180</th><th>Finish</th><th>Pf./Leg</th><th>Matches</th><th>Legs</th></tr>${names.map(row).join('')}</table></div><p class="mut">Ø = 3-Dart-Average, sortiert nach Average. Pf./Leg = Pfeile pro gewonnenem Leg. Matches und Legs: gewonnen/gespielt. Die Daten bleiben auf diesem Gerät gespeichert.</p>`}
function derive(){S.players=[...R.filter(p=>p.on).map(p=>p.n),...GU].slice(0,64);if(M)LV[M.tm==null?'f':M.tm]=M;try{localStorage.setItem('dart-st',JSON.stringify(ST))}catch(e){}}
function render(){derive();push();
 $('#nav').innerHTML=Object.keys(T).map(k=>`<button class="tab ${tab==k?'on':''}" data-a="tab" data-v="${k}">${T[k]}</button>`).join('');
 $('#v').innerHTML={pl:vPlayers,setup:vSetup,plan:vPlan,live:vLive,ts:vTS,match:vMatch,stats:vStats}[tab]()}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,v=b.dataset.v;
 if(a=='tab'){tab=v;msg='';gm='';RS=false}
 else if(a=='b')S.boards=Math.min(8,Math.max(1,S.boards+ +v));
 else if(a=='lg')S.legs=Math.min(5,Math.max(1,S.legs+ +v));
 else if(a=='gr')S.groups=Math.min(Math.max(1,Math.floor(S.players.length/2)),Math.max(0,S.groups+ +v));
 else if(a=='mode')S.mode=+v;
 else if(a=='dout')S.dout=v=='true';
 else if(a=='padd')addName($('#nn').value,0);
 else if(a=='gadd')addName($('#gn').value,1);
 else if(a=='pdel'){R.splice(+v,1);save()}
 else if(a=='gdel')GU.splice(+v,1);
 else if(a=='all'){const f=!R.every(p=>p.on);R.forEach(p=>p.on=f);save()}
 else if(a=='go'){if(S.players.length<2||pick[0]==pick[1]||pick.some(i=>i>=S.players.length))msg='Bitte zwei verschiedene Spieler wählen.';else{msg='';start(pick.map(i=>S.players[i]))}}
 else if(a=='tstart')startTN();
 else if(a=='play'){const t=allM().find(x=>x.id==v);if(LV[v]&&!LV[v].over){M=LV[v];hist=[]}else start([t.a,t.b],t.id);tab='match'}
 else if(a=='mod')M.mod=v;
 else if(a=='d'){dart(+v,M.mod);M.mod='S'}
 else if(a=='miss'){dart(0,'M');M.mod='S'}
 else if(a=='undo'){if(hist.length){const s=JSON.parse(hist.pop());M=s.M;ST=s.ST;TN=s.TN;PL=s.PL;savePL()}}
 else if(a=='new'){delete LV.f;M=null}
 else if(a=='sv')SV=v;
 else if(a=='changecode'){turnierCode=normCode($('#tcode').value)||turnierCode;$('#tcode').value=turnierCode;save();connect()}
 else if(a=='rst'){if(RS){ST={};PL={};BASE={};savePL();if(M)M.p.forEach(n=>ST[n]=mk());RS=false}else RS=true}
 else if(a=='back'){delete LV[M.tm];M=null;tab='plan'}
 render()});

document.addEventListener('change',e=>{const d=e.target.dataset;if(d.i!=null)pick[+d.i]=+e.target.value;if(d.c!=null){R[+d.c].on=e.target.checked;save();render()}});
document.addEventListener('keydown',e=>{const B={nn:'padd',gn:'gadd',tcode:'changecode'}[e.target.id];if(e.key=='Enter'&&B){e.preventDefault();$('[data-a='+B+']').click()}});
// ---- Firebase: Raum-Sync ----
window.addEventListener('error',e=>{const b=document.getElementById('room-badge');if(b)b.textContent='Fehler: '+(e.message||'?')+(e.lineno?' (Z.'+e.lineno+')':'')});
const firebaseConfig={apiKey:"AIzaSyAfPXMdHOAbiVlMkkP4MZGJAUYaAkW3Iqs",authDomain:"dart-6fe90.firebaseapp.com",databaseURL:"https://dart-6fe90-default-rtdb.europe-west1.firebasedatabase.app",projectId:"dart-6fe90",storageBucket:"dart-6fe90.firebasestorage.app",messagingSenderId:"341118542776",appId:"1:341118542776:web:ef0c521f0594d1490d654d"};
let db=null,INC=null;
try{firebase.initializeApp(firebaseConfig);db=firebase.database();INC=firebase.database.ServerValue.increment}catch(e){}
const normCode=c=>(c||'').trim().toLowerCase().replace(/[^a-z0-9_-]/g,'-').slice(0,20);
let turnierCode;try{turnierCode=normCode(localStorage.getItem('dart-code'))}catch(e){}
turnierCode=turnierCode||'abend-'+Math.floor(Math.random()*9000+1000);
const encK=n=>encodeURIComponent(n).replace(/\./g,'%2E'),decK=k=>{try{return decodeURIComponent(k)}catch(e){return k}};
const arr=x=>x?(Array.isArray(x)?x:Object.keys(x).sort((a,b)=>a-b).map(k=>x[k])):[];
const clone=o=>JSON.parse(JSON.stringify(o===undefined?null:o));
function flat(o,p,out){out=out||{};if(o!==null&&o!==undefined&&typeof o=='object'){for(const k in o)flat(o[k],p?p+'/'+k:k,out)}else if(o!==null&&o!==undefined)out[p]=o;return out}
const cfgObj=()=>({S:{boards:S.boards,mode:S.mode,legs:S.legs,dout:S.dout,groups:S.groups},R:R.map(p=>({n:p.n,on:!!p.on})),GU});
const fixM=m=>({...m,p:arr(m.p),rem:arr(m.rem),legs:arr(m.legs),last:arr(m.last),ld:arr(m.ld),dr:arr(m.dr),pt:arr(m.pt),vd:arr(m.vd),tm:m.tm==null?null:m.tm,over:!!m.over,vp:m.vp||0,mod:m.mod||'S'});
function fixTN(t){const m=x=>({...x,la:x.la||0,lb:x.lb||0,done:!!x.done});
 const r={G:arr(t.G).map(arr),gm:arr(t.gm).map(m),ko:t.ko?arr(t.ko).map(R=>arr(R).map(m)):null,p3:t.p3?m(t.p3):null};if(t.rec)r.rec=t.rec;return r}
let ROOM=null,LAST,WROTE=new Set(),first=true,online=false,ERR='';
const fresh=()=>({tn:{},st:{},pl:{},cfg:'',base:'',live:{}});
const badge=t=>{const b=$('#room-badge');if(b)b.textContent=t};
const showBadge=()=>{badge(ERR||(online?'Raum: '+turnierCode+' ✓':'offline'));const r=document.getElementById('rstat');if(r)r.textContent=ERR||(online?'Verbunden mit '+turnierCode:'Nicht verbunden')};
if(db)db.ref('.info/connected').on('value',s=>{online=!!s.val();showBadge()});
function connect(){
 if(!db){badge('Lokal (ohne Sync)');return}
 if(ROOM)ROOM.off();
 first=true;LAST=fresh();WROTE=new Set();ERR='';badge('Raum: '+turnierCode+' …');
 ROOM=db.ref('rooms/'+turnierCode);
 ROOM.on('value',onRoom,e=>{ERR='Fehler: '+(e.code||e.message);showBadge()})}
function onRoom(snap){
 try{
  ERR='';showBadge();
  if(first){first=false;if(!snap.exists()){LAST=fresh();push();return}}
  apply(snap.val()||{});softRender()
 }catch(e){ERR='Fehler: '+e.message;showBadge();console.error(e)}}
function apply(v){
 if(v.cfg){if(v.cfg.S)Object.assign(S,v.cfg.S);R=arr(v.cfg.R).map(p=>({n:p.n,on:!!p.on}));GU=arr(v.cfg.GU);LAST.cfg=JSON.stringify(cfgObj())}
 TN=v.tn?fixTN(v.tn):null;LAST.tn=flat(TN,'');
 if(v.st){ST={};for(const k in v.st)ST[decK(k)]=Object.assign(mk(),v.st[k]);LAST.st=clone(ST)}
 if(v.pl){PL={};for(const k in v.pl){const a=v.pl[k];PL[decK(k)]=[0,1,2].map(i=>(a&&a[i])||0)}LAST.pl=clone(PL)}
 if(v.base){BASE={};for(const k in v.base)BASE[decK(k)]=Object.assign(mk(),v.base[k]);LAST.base=JSON.stringify(BASE)}
 const lv=v.live||{},mine=M&&M.tm!=null?String(M.tm):null;
 LV={};for(const k in lv)if(k!==mine&&lv[k]&&arr(lv[k].p).length==2)LV[k]=fixM(lv[k]);
 if(M)LV[M.tm==null?'f':M.tm]=M}
function softRender(){
 if(tab=='match')return;
 const a=document.activeElement;if(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName))return;
 const y=window.scrollY;render();window.scrollTo(0,y)}
function push(){
 if(!ROOM||first)return;
 try{
  const u={},MX=['hiF','hT'];
  const nt=flat(TN,'');
  for(const p in nt)if(LAST.tn[p]!==nt[p])u['tn/'+p]=nt[p];
  for(const p in LAST.tn)if(!(p in nt))u['tn/'+p]=null;
  LAST.tn=nt;
  for(const n in ST){const k=encK(n),s=ST[n],o=LAST.st[n]||{};
   for(const f in s){const d=(s[f]||0)-(o[f]||0);if(!d)continue;
    if(MX.includes(f)){if(d>0)ROOM.child('st/'+k+'/'+f).transaction(c=>Math.max(c||0,s[f]));else u['st/'+k+'/'+f]=s[f]}
    else u['st/'+k+'/'+f]=INC(d)}}
  for(const n in LAST.st)if(!(n in ST))for(const f in LAST.st[n])u['st/'+encK(n)+'/'+f]=MX.includes(f)?0:INC(-(LAST.st[n][f]||0));
  LAST.st=clone(ST);
  for(const n in PL){const o=LAST.pl[n]||[0,0,0];[0,1,2].forEach(i=>{const d=(PL[n][i]||0)-(o[i]||0);if(d)u['pl/'+encK(n)+'/'+i]=INC(d)})}
  for(const n in LAST.pl)if(!(n in PL))[0,1,2].forEach(i=>{if(LAST.pl[n][i])u['pl/'+encK(n)+'/'+i]=INC(-LAST.pl[n][i])});
  LAST.pl=clone(PL);
  const nb=JSON.stringify(BASE);
  if(nb!==LAST.base){const o={};for(const n in BASE)o[encK(n)]=BASE[n];u.base=Object.keys(o).length?o:null;LAST.base=nb}
  const nc=JSON.stringify(cfgObj());if(nc!==LAST.cfg){u.cfg=JSON.parse(nc);LAST.cfg=nc}
  if(M&&M.tm!=null){const t=String(M.tm),js=JSON.stringify(M);if(LAST.live[t]!==js){u['live/'+t]=JSON.parse(js);LAST.live[t]=js;WROTE.add(t)}}
  for(const t of [...WROTE])if(!(t in LV)&&!(M&&M.tm==t)){u['live/'+t]=null;WROTE.delete(t);delete LAST.live[t]}
  if(Object.keys(u).length)ROOM.update(u).catch(e=>{ERR='Schreibfehler: '+(e.code||e.message);showBadge()})
 }catch(e){ERR='Sync-Fehler: '+e.message;showBadge()}}
connect();
render();
